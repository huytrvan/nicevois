<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Iframe with Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        iframe {
            width: 100%;
            height: 1000px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }

        form {
            max-width: 400px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <h1>Embedded Iframe and Contact Form</h1>
    <iframe src="http://localhost:3000/" title="Embedded Content"></iframe>

    <form id="ContactForm">
        <label for="name" id="ContactForm-name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email" id="ContactForm-email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message" id="ContactForm-message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Submit</button>
    </form>
</body>

</html>
